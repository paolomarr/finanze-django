# Standalone demo stack: separate project name, images, volume and env file,
# so it can run next to the regular instance without touching its data.
#   ./deploy_demo.sh            (creates .env.demo and starts the stack)
#   docker compose -f docker-compose.demo.yml down -v   (wipe the demo)
#
# The only published port is the frontend's nginx, which serves the React app
# and proxies /api/ and /admin/ to django: frontend and API share one origin.
#
# FRONTEND_SOURCE is the frontend build context: by default the public GitHub
# repo (append #<branch|tag|commit> to pin a version); set it to a local path,
# e.g. ../finanzeapp-react-frontend, to build from a checkout.
name: finanzeapp-demo
services:

  frontend:
    build:
      context: ${FRONTEND_SOURCE:-https://github.com/paolomarr/FinanzeApp-React-Frontend.git#main}
      dockerfile: Dockerfile.demo
    depends_on:
      - django
    ports:
      - ${DEMO_BIND:-127.0.0.1}:${DEMO_PORT:-8004}:80

  django:
    build:
      dockerfile: ./Dockerfile_django
    env_file:
      - path: .env.demo        # outside app/finanze: not copied into the image
        required: true
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    volumes:
      - postgres_demo_data:/var/lib/postgresql/data/
    environment:
      - "POSTGRES_HOST_AUTH_METHOD=trust"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  postgres_demo_data:
