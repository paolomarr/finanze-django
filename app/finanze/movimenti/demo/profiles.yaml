# Generation profiles, one per (category, subcategory).
#
# schedule (exactly one of):
#   monthly:  {day: N, jitter: days, months: [..]}   fixed recurring; `months` optional
#                                                    (omit = every month)
#   poisson:  {per_month: rate, boost: {month: factor}}
#                                                    random occurrences; `boost` optional
#                                                    multiplies the rate in given months
#   seasonal: {months: [..], per_month: rate}        poisson, only in given months
# amount (exactly one of):
#   lognormal: {median, sigma, min, max}
#   fixed:     {value, drift_per_year}               drift compounds yearly (price rises)
# account: which simulated account the movement hits (for BALANCE coherence).
#          Every movement profile hits Checking; kept explicit for future use.
# templates: placeholders are filled from `pools` of the same profile, plus the
#            built-ins {month_name}, {year}, {quarter}.
# pools: list of strings, or {range: [lo, hi]} for an integer, or
#        {pattern: "[A-Z]{6}"} for a random code.
#
# Expected volume: ~34 movements/month + 3 BALANCE rows/month
#                  -> ~900 rows over 24 months.

profiles:

  # ------------------------------------------------------------------ Salary (+)
  - category: Salary
    subcategory: Monthly pay
    account: Checking
    schedule: {monthly: {day: 27, jitter: 1}}
    amount: {fixed: {value: 2350.00, drift_per_year: 0.03}}
    templates:
      - "Salary {month_name} {year} - {employer}"
    pools:
      employer: ["Northwind Logistics Ltd"]   # one employer: recurring rows stay consistent

  - category: Salary
    subcategory: Bonus
    account: Checking
    schedule: {monthly: {day: 15, jitter: 2, months: [7, 12]}}
    amount: {lognormal: {median: 900.0, sigma: 0.3, min: 400.0, max: 2000.0}}
    templates:
      - "{kind} - {employer}"
    pools:
      kind: [Performance bonus, Holiday bonus]
      employer: ["Northwind Logistics Ltd"]

  - category: Salary
    subcategory: Expense refund
    account: Checking
    schedule: {poisson: {per_month: 0.3}}
    amount: {lognormal: {median: 85.0, sigma: 0.7, min: 12.0, max: 600.0}}
    templates:
      - "Expense reimbursement {ref} - {employer}"
      - "Travel expenses refund {month_name}"
    pools:
      employer: ["Northwind Logistics Ltd"]
      ref: {pattern: "EXP-[0-9]{5}"}

  # ------------------------------------------------------------ Other income (+)
  - category: Other income
    subcategory: Gifts received
    account: Checking
    schedule: {poisson: {per_month: 0.05, boost: {12: 10}}}
    amount: {lognormal: {median: 100.0, sigma: 0.5, min: 20.0, max: 400.0}}
    templates:
      - "Transfer from {person} - {reason}"
    pools:
      person: [Aunt Margaret, Grandpa Joe, Mum and Dad, Uncle Frank]
      reason: [Happy birthday!, Merry Christmas, A little something, For the holidays]

  - category: Other income
    subcategory: Resale
    account: Checking
    schedule: {poisson: {per_month: 0.2}}
    amount: {lognormal: {median: 35.0, sigma: 0.8, min: 5.0, max: 350.0}}
    templates:
      - "{platform} sale - {item}"
      - "Payout {platform} #{order}"
    pools:
      platform: [ShelfSwap, ReUse Market, BidBox]
      item: [old bike, bookshelf, winter jacket, board games, camera lens, baby stroller, guitar amp]
      order: {range: [100000, 999999]}

  - category: Other income
    subcategory: Interest & dividends
    account: Checking
    schedule: {monthly: {day: 31, jitter: 0, months: [3, 6, 9, 12]}}
    amount: {lognormal: {median: 28.0, sigma: 0.4, min: 5.0, max: 120.0}}
    templates:
      - "Interest credit Q{quarter} {year} - {bank}"
    pools:
      bank: [Harbor Savings Bank]

  - category: Other income
    subcategory: Tax refund
    account: Checking
    schedule: {monthly: {day: 20, jitter: 10, months: [8]}}
    amount: {lognormal: {median: 320.0, sigma: 0.5, min: 50.0, max: 1200.0}}
    templates:
      - "Tax refund {prev_year} - Revenue Office"
    pools: {}

  # ----------------------------------------------------------------- Housing (-)
  - category: Housing
