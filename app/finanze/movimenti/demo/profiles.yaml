  # ------------------------------------------------------------ Taxes & fees (-)
  - category: Taxes & fees
    subcategory: Income tax
    account: Checking
    schedule: {monthly: {day: 30, jitter: 0, months: [6, 11]}}
    amount: {lognormal: {median: 380.0, sigma: 0.4, min: 100.0, max: 1200.0}}
    templates:
      - "Income tax payment {year} - Revenue Office"
    pools: {}

  - category: Taxes & fees
    subcategory: Bank fees
    account: Checking
    schedule: {monthly: {day: 31, jitter: 0}}   # day clamped to month end
    amount: {fixed: {value: 3.50, drift_per_year: 0.0}}
    templates:
      - "Account maintenance fee {month_name} - {bank}"
    pools:
      bank: [Harbor Savings Bank]

  - category: Taxes & fees
    subcategory: Car tax
    account: Checking
    schedule: {monthly: {day: 20, jitter: 5, months: [4]}}
    amount: {fixed: {value: 210.00, drift_per_year: 0.0}}
    templates:
      - "Vehicle tax {year} - plate {plate}"
    pools:
      plate: ["RT 482 KX"]

# Monthly BALANCE declarations: one row per account, same date, no subcategory.
# Checking is driven by the simulated movements; Savings and Brokerage have no
# movements of their own, so they evolve by a slow drift.
balance:
  schedule: {monthly: {day: random, jitter: 0}}
  noise: 0.015          # +/- relative error on each declared amount
  accounts:
    - name: Checking
      description: "Checking account - {bank}"
      start: 4200.00
    - name: Savings
      description: "Savings account - {bank}"
      start: 18500.00
      drift: {monthly_mean: 120.0, monthly_sigma: 60.0}
    - name: Brokerage
      description: "Brokerage account - {broker}"
      start: 9000.00
      drift: {monthly_return_mean: 0.005, monthly_return_sigma: 0.03}
  pools:
    bank: [Harbor Savings Bank]
    broker: [TradeNest]
